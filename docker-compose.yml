services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartbite-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - SECRET_KEY=${SECRET_KEY:-smartbite_production_secret_key_change_me}
      - DATABASE_PATH=/app/data/canteen.db
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost}
      - ADMIN_NAME=${ADMIN_NAME:-Campus Admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@smartbite.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    volumes:
      - canteen-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - smartbite-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartbite-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smartbite-net

volumes:
  canteen-data:
    name: smartbite_canteen_data

networks:
  smartbite-net:
    name: smartbite_network
    driver: bridge
